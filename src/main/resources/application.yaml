spring:
  application:
    name: knowledegehub
  datasource:
    url: jdbc:postgresql://localhost:5432/knowledgehub
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  ai:
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: nomic-embed-text
